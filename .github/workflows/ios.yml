name: ios

# Builds the iPad app for iPadOS 26, runs the unit tests and the UI tests on an iPad simulator, and saves the
# UI test screenshots as PNG files in the "ios-screenshots" artifact. Nothing here runs on a laptop.
# A last step builds Release, runs one lesson UI test on it and checks that its session log holds no words.
#
# Runner: GitHub's macos-26 image: Xcode 26.6 (SDK iOS 26.5) and iPad simulators on iOS 26.2, 26.4 and 26.5.
# The repo is public since 2026-11-28, and GitHub-hosted runners (macOS included) are free and unmetered for public
# repositories, so this no longer spends Blacksmith's free Mac minutes (one Mac minute counted as 20 of the 3,000).
# Slower than Blacksmith's M4 machine (blacksmith-6vcpu-macos-26, same image); switch back only if speed matters more than cost.
# Source: https://github.com/actions/runner-images/blob/main/images/macos/macos-26-arm64-Readme.md
# Xcode 27 is only a public preview on the runner image, so 26.6 is pinned.

# Runs on pull requests that touch the iPad app (free now), and by hand:  gh workflow run ios.yml --ref <branch>
# A server-only change never starts it. Merge to main only after a green run on that exact commit.
on:
  workflow_dispatch:
    inputs:
      release_log_check:
        description: "Also build Release, run the lesson UI test on it and check its session log holds no words (one more compile)"
        type: boolean
        default: true
  pull_request:
    paths:
      - "ios/**"
      - "shared/**"
      - ".github/workflows/ios.yml"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      PROJECT: ios/PencilTutor.xcodeproj
      SCHEME: PencilTutor
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          echo "iphonesimulator SDK: $(xcrun --sdk iphonesimulator --show-sdk-version)"
          xcrun simctl list runtimes

      # Direct download of a pinned release: `brew install` refreshes Homebrew first, which costs paid minutes.
      - name: Install xcodegen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate the Xcode project
        working-directory: ios
        run: |
          xcodegen --version
          xcodegen generate

      - name: Pick and boot an iPad simulator
        run: |
          UDID=$(python3 ios/Scripts/ci_pick_simulator.py)
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Build app and tests
        run: |
          mkdir -p ios/artifacts/logs ios/results
          if ! xcodebuild build-for-testing \
              -project "$PROJECT" -scheme "$SCHEME" -configuration Debug \
              -destination "id=$UDID" -derivedDataPath ios/build \
              CODE_SIGNING_ALLOWED=NO > ios/artifacts/logs/build.log 2>&1; then
            echo "BUILD FAILED. Errors:"
            grep -E "error:|warning: unable|\*\* BUILD" ios/artifacts/logs/build.log | head -n 60 || true
            echo "--- last 80 lines ---"
            tail -n 80 ios/artifacts/logs/build.log
            exit 1
          fi
          echo "build ok"
          grep -E "bundle_problems:" ios/artifacts/logs/build.log || echo "note: bundle_problems output not found in log"

      # -collect-test-diagnostics never: on a failure xcodebuild otherwise spends ~10 minutes trying to pull a
      # sysdiagnose from the simulator and then times out (run 43849954749). The xcresult and logs still upload.
      - name: Unit tests
        run: |
          if ! xcodebuild test-without-building \
              -project "$PROJECT" -scheme "$SCHEME" -configuration Debug \
              -destination "id=$UDID" -derivedDataPath ios/build \
              -only-testing:PencilTutorTests \
              -resultBundlePath ios/results/unit.xcresult \
              -collect-test-diagnostics never \
              CODE_SIGNING_ALLOWED=NO > ios/artifacts/logs/unit-tests.log 2>&1; then
            echo "UNIT TESTS FAILED. Failures:"
            grep -E "error:|failed|Test Case .* failed" ios/artifacts/logs/unit-tests.log | head -n 60 || true
            echo "--- last 60 lines ---"
            tail -n 60 ios/artifacts/logs/unit-tests.log
            exit 1
          fi
          grep -E "Executed [0-9]+ tests" ios/artifacts/logs/unit-tests.log | tail -n 1

      - name: UI tests (scripted tutor, screenshots)
        run: |
          if ! xcodebuild test-without-building \
              -project "$PROJECT" -scheme "$SCHEME" -configuration Debug \
              -destination "id=$UDID" -derivedDataPath ios/build \
              -only-testing:PencilTutorUITests \
              -resultBundlePath ios/results/ui.xcresult \
              -collect-test-diagnostics never \
              CODE_SIGNING_ALLOWED=NO > ios/artifacts/logs/ui-tests.log 2>&1; then
            echo "UI TESTS FAILED. Failures:"
            grep -E "error:|failed|Test Case .* failed" ios/artifacts/logs/ui-tests.log | head -n 60 || true
            echo "--- last 60 lines ---"
            tail -n 60 ios/artifacts/logs/ui-tests.log
            exit 1
          fi
          grep -E "Executed [0-9]+ tests" ios/artifacts/logs/ui-tests.log | tail -n 1

      - name: Export screenshots as PNG files
        if: always()
        run: |
          if [ -d ios/results/ui.xcresult ]; then
            python3 ios/Scripts/ci_export_screenshots.py ios/results/ui.xcresult ios/artifacts/screenshots
            ls -l ios/artifacts/screenshots
          else
            echo "no ui.xcresult to export (the UI test step did not produce one)"
          fi

      - name: Copy the app's on-device session log from the simulator
        if: always()
        run: |
          mkdir -p ios/artifacts/session-logs
          APP_DATA=$(xcrun simctl get_app_container "$UDID" com.edwardtran.penciltutor data 2>/dev/null || true)
          if [ -n "$APP_DATA" ] && ls "$APP_DATA"/Documents/session-*.jsonl >/dev/null 2>&1; then
            cp "$APP_DATA"/Documents/session-*.jsonl ios/artifacts/session-logs/
            ls -l ios/artifacts/session-logs
          else
            echo "no session log found in the simulator container ($APP_DATA)"
          fi

      # Release keeps TutorSession.logsWords false: the session log holds counts and labels, never the concept, the lesson or a
      # question. The Debug runs above write words on purpose, so they cannot prove that. This step builds the Release
      # configuration for the simulator, runs one lesson UI test on it (type a concept, read the lesson, ask a follow-up) and
      # checks the log it wrote with ios/Scripts/check_release_log.py. ENABLE_TESTABILITY=YES only so the unit-test target in the
      # scheme still compiles (`@testable import`); the app is still the Release configuration (no DEBUG, optimised). The app is
      # uninstalled first so the Debug logs in the simulator's container are gone. Device signing is a separate issue.
      - name: Release build, lesson UI test, and a check of its session log
        if: ${{ github.event_name == 'pull_request' || inputs.release_log_check }}
        run: |
          mkdir -p ios/artifacts/release-logs
          xcrun simctl uninstall "$UDID" com.edwardtran.penciltutor || true
          if ! xcodebuild test \
              -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
              -destination "id=$UDID" -derivedDataPath ios/build-release \
              -only-testing:PencilTutorUITests/LessonUITests/testAFollowUpIsAddedToThePanel \
              -resultBundlePath ios/results/release-ui.xcresult \
              -collect-test-diagnostics never \
              ENABLE_TESTABILITY=YES CODE_SIGNING_ALLOWED=NO > ios/artifacts/logs/release-ui-tests.log 2>&1; then
            echo "RELEASE UI TEST FAILED. Failures:"
            grep -E "error:|failed|Test Case .* failed" ios/artifacts/logs/release-ui-tests.log | head -n 60 || true
            echo "--- last 60 lines ---"
            tail -n 60 ios/artifacts/logs/release-ui-tests.log
            exit 1
          fi
          grep -E "Executed [0-9]+ tests" ios/artifacts/logs/release-ui-tests.log | tail -n 1
          APP_DATA=$(xcrun simctl get_app_container "$UDID" com.edwardtran.penciltutor data)
          cp "$APP_DATA"/Documents/session-*.jsonl ios/artifacts/release-logs/
          python3 ios/Scripts/check_release_log.py ios/artifacts/release-logs

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          path: ios/artifacts/screenshots
          if-no-files-found: warn

      - name: Upload result bundles and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-results-and-logs
          path: |
            ios/results
            ios/artifacts/logs
            ios/artifacts/session-logs
            ios/artifacts/release-logs
          if-no-files-found: warn
